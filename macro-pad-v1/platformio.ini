[env:rp2040]
platform  = C:\Users\Samu\.platformio\platforms\raspberrypi@src-ff76a3915224135aafad379817f41edd
board     = pico
framework = arduino
board_build.core = earlephilhower
board_build.arduino.earlephilhower.usb_manufacturer = Samu Amy
board_build.arduino.earlephilhower.usb_product = MacroPad v1
board_build.arduino.earlephilhower.usb_vid = 0x1209 ; TODO: solo per test locale (poi richedi su https://pid.codes/howto/)
board_build.arduino.earlephilhower.usb_pid = 0x0001

lib_deps =
  olikraus/U8g2 @ ^2.35.30
  adafruit/Adafruit TinyUSB Library @ ^3.4.4
  

build_flags =
  -DUSE_TINYUSB
; lib_extra_dirs = ~/Documents/Arduino/libraries
